{% extends 'base.html' %} {% block title %}材料一覧{% endblock %} {% block
content %}
<h1>登録済み材料一覧</h1>
<table border="1">
  <tr>
    <th>名前</th>
    <th>単位</th>
    <th>在庫</th>
    <th>操作</th>
  </tr>
  {% for material in materials %}
  <tr>
    <td>{{ material.name }}</td>
    <td>{{ material.unit }}</td>
    <td>{{ material.stock }}</td>
    <td>
      <a href="{{ url_for('edit_material', id=material.id) }}">編集</a>
      <form
        action="{{ url_for('delete_material', id=material.id) }}"
        method="post"
        style="display: inline"
      >
        <button
          type="submit"
          onclick="return confirm('削除してもよろしいですか？');"
        >
          削除
        </button>
      </form>
    </td>
  </tr>
  {% endfor %}
</table>
<a href="{{ url_for('add_material') }}">新しい材料を追加</a><br />
<a href="{{ url_for('index') }}">トップページに戻る</a>
{% endblock %}
