{% extends 'base.html' %}

{% block title %}商品レシピ編集{% endblock %}

{% block content %}
<h1>商品レシピを編集</h1>
<form method="post">
  <label for="product_id">商品：</label>
  <select name="product_id">
    {% for p in products %}
      <option value="{{ p.id }}" {% if p.id == recipe.product_id %}selected{% endif %}>{{ p.name }}</option>
    {% endfor %}
  </select><br>

  <label for="material_id">材料：</label>
  <select name="material_id">
    {% for m in materials %}
      <option value="{{ m.id }}" {% if m.id == recipe.material_id %}selected{% endif %}>{{ m.name }}</option>
    {% endfor %}
  </select><br>

  <label for="quantity">数量：</label>
  <input type="number" name="quantity" step="0.01" value="{{ recipe.quantity }}" required><br>

  <button type="submit">更新</button>
</form>

<a href="{{ url_for('view_product_recipes') }}">← 一覧に戻る</a>
{% endblock %}
