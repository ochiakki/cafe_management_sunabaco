{% extends 'base.html' %} {% block title %}製品出庫の追加{% endblock %} {% block
content %}
<h1>製品出庫の追加</h1>

{% if error_message %}
<div class="error">{{ error_message }}</div>
{% endif %}

<form method="POST">
  <div id="product-rows">
    <div class="form-group">
      <label>商品:</label>
      <select name="product_ids">
        {% for product in products %}
        <option value="{{ product.id }}">{{ product.name }}</option>
        {% endfor %}
      </select>
      <label>数量:</label>
      <input type="number" name="quantities" step="0.1" min="0" />
    </div>
  </div>

  <button type="button" onclick="addProductRow()">商品を追加</button>

  <div class="form-group">
    <label>備考:</label>
    <input type="text" name="note" />
  </div>

  <input type="submit" value="出庫する" />
</form>

<p><a href="{{ url_for('view_product_outputs') }}">出庫履歴を見る</a></p>
{% endblock %} {% block script %}
<script>
  function addProductRow() {
    const container = document.getElementById("product-rows");
    const newRow = document.createElement("div");
    newRow.className = "form-group";

    newRow.innerHTML = `
      <label>商品:</label>
      <select name="product_ids">
        {% for product in products %}
          <option value="{{ product.id }}">{{ product.name }}</option>
        {% endfor %}
      </select>
      <label>数量:</label>
      <input type="number" name="quantities" step="0.1" min="0" />
      <button type="button" onclick="this.parentElement.remove()">削除</button>
    `;
    container.appendChild(newRow);
  }
</script>
{% endblock %}
