{% extends 'base.html' %} {% block title %}材料編集{% endblock %} {% block
content %}
<h1>材料を編集</h1>

<form method="post">
  <div class="form-group">
    <label for="name">名前：</label>
    <input
      type="text"
      id="name"
      name="name"
      value="{{ material.name }}"
      required
    />
  </div>

  <div class="form-group">
    <label for="unit">単位：</label>
    <input
      type="text"
      id="unit"
      name="unit"
      value="{{ material.unit }}"
      required
    />
  </div>

  <div class="form-group">
    <label for="stock">在庫：</label>
    <input
      type="number"
      id="stock"
      name="stock"
      value="{{ material.stock }}"
      step="0.01"
      required
    />
  </div>

  <button type="submit">保存</button>
</form>

<p><a href="{{ url_for('view_materials') }}">材料一覧に戻る</a></p>
{% endblock %}
